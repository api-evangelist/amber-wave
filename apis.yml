name: Amber Wave
description: >-
  AmberWave, Inc. (formerly AmberWave Systems Corporation) is a Lowell,
  Massachusetts deep-technology company that researches, develops, and licenses
  semiconductor and photovoltaic materials technology. It originated strained-silicon
  and aspect-ratio-trapping techniques from MIT and Bell Labs research, and today
  develops Ultra-Thin Silicon (UTSi) flexible solar cells and modules that weigh
  roughly 90% less than conventional panels, targeting lightweight commercial
  rooftops, off-grid power, building integration, vehicle, and aerospace
  applications. AmberWave is a Battery Ventures portfolio company. It publishes a
  corporate website but exposes no public API, developer portal, SDKs, or technical
  documentation surface, so there are no machine-readable API artifacts to enrich.
